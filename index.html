<!DOCTYPE html>
<html>
<head>
    <title>Link Protetto</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
        input { padding: 15px; font-size: 18px; border: 2px solid #ccc; border-radius: 8px; text-align: center; width: 250px; }
    </style>
</head>
<body>
    <!-- Basta digitare: il controllo è automatico a ogni lettera inserita -->
    <input type="password" id="key" placeholder="Inserisci la parola chiave" oninput="checkKey()">

    <script>
        function checkKey() {
            var input = document.getElementById("key").value;
            
            // SOSTITUISCI QUI LA TUA PAROLA CHIAVE E IL LINK DI DESTINAZIONE
            if (input === "sempre") { 
                window.location.href = "https://dl.dropboxusercontent.com/scl/fi/b8m3wgeyu0lcwedb3saml/AUGURI-GIAMMA.mp4?rlkey=67igon74kb6nyq6uzde7v5g0z&st=957udval&raw=1"; 
            }
        }
    </script>
</body>
</html>
